<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141838"/>
      <stop offset="100%" stop-color="#070714"/>
    </radialGradient>
    <linearGradient id="shipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <linearGradient id="cockpitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0077"/>
      <stop offset="100%" stop-color="#ffbe0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.3" stroke-dasharray="10 10"/>
  <!-- Thruster flame -->
  <polygon points="256,410 230,340 282,340" fill="#00f0ff" filter="url(#glow)"/>
  <polygon points="256,385 240,340 272,340" fill="#ffbe0b"/>
  <!-- Ship Body -->
  <polygon points="256,105 385,345 295,310 256,335 217,310 127,345" fill="#0b1026" stroke="url(#shipGrad)" stroke-width="12" filter="url(#glow)"/>
  <!-- Cockpit -->
  <polygon points="256,170 290,270 256,290 222,270" fill="url(#cockpitGrad)"/>
</svg>
